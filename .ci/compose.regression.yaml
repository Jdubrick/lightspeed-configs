services:
  lightspeed-core:
    image: "${LIGHTSPEED_CORE_IMAGE:?LIGHTSPEED_CORE_IMAGE is required}"
    env_file: !reset []
    environment:
      SERVICE_HOST: "0.0.0.0"
      ENABLE_VLLM: "${ENABLE_VLLM:-true}"
      ENABLE_OPENAI: "${ENABLE_OPENAI:-true}"
      ENABLE_VALIDATION: "${ENABLE_VALIDATION:-true}"
      VALIDATION_PROVIDER: "${VALIDATION_PROVIDER:-vllm}"
      VALIDATION_MODEL_NAME: "${VALIDATION_MODEL_NAME:-redhataillama-31-8b-instruct}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
      VLLM_API_KEY: "${VLLM_API_KEY:?VLLM_API_KEY is required}"
      VLLM_URL: "${VLLM_URL:?VLLM_URL is required}"
      VLLM_MAX_TOKENS: "${VLLM_MAX_TOKENS:-4096}"
      VLLM_TLS_VERIFY: "${VLLM_TLS_VERIFY:-true}"
    volumes:
      - ../.ci/work/lightspeed-stack.yaml:/app-root/lightspeed-stack.yaml:Z
      - ../.ci/artifacts/feedback:/tmp/data/feedback:Z
      - ../.ci/artifacts/results:/tmp/results:Z

  test-mcp-server:
    image: quay.io/redhat-ai-dev/test-mcp-server:latest
    expose:
      - "8888"

  regression-runner:
    image: quay.io/redhat-ai-dev/lightspeed-regression-runner:release-1.10-latest
    depends_on:
      lightspeed-core:
        condition: service_healthy
      test-mcp-server:
        condition: service_started
    environment:
      LS_BASE_URL: http://lightspeed-core:8080
      FEEDBACK_STORAGE_PATH: /tmp/data/feedback
      RESULTS_DIR: /tmp/results
      PROVIDER_MODE: "${PROVIDER_MODE:-both}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      VLLM_MODEL: "${VLLM_MODEL:-redhataillama-31-8b-instruct}"
      READINESS_GRACE_SECONDS: "15"
    volumes:
      - ../.ci/artifacts/feedback:/tmp/data/feedback:Z
      - ../.ci/artifacts/results:/tmp/results:Z
